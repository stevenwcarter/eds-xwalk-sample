[package]
name = "signups-stats"
edition = "2024"
version = "0.1.0"
publish = false
description = "Demo ledge plugin: a signups-stats renderer that reads the /data/signups sheet via the read-sheet host capability and renders memoized aggregate stats, keyed on the sheet's source version so a new signup always misses the cache."

[lib]
# A wasm component is built from a cdylib core module (`wasm-tools component new`).
crate-type = ["cdylib"]

[dependencies]
ledge-plugin-sdk = { path = "../../../ledge-cms/crates/ledge-plugin-sdk" }
